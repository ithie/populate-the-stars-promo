                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 32px 16px 48px;
            }

            main {
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
                gap: 28px;
                width: 100%;
                max-width: 640px;
            }

            a {
                color: #fff;
                text-decoration: none;
                transition: color 0.2s;
            }

            a:hover {
                color: var(--res);
            }

            /* ── Promo ── */


            #sky {
                width: min(360px, 92vw);
                height: auto;
                aspect-ratio: 3 / 2;
            }

            h1 {
                margin: 0;
                font-size: clamp(22px, 6vw, 44px);
                font-weight: normal;
                line-height: 1.3;
                letter-spacing: 4px;
                color: var(--pop);
                text-shadow:
                    0 0 18px var(--pop),
                    0 0 46px rgba(255, 160, 46, 0.35);
            }

            .tagline {
                margin: 0;
                font-size: var(--ps-2);
                line-height: 2;
                letter-spacing: 2px;
            }

            .tagline .accent {
                color: var(--res);
            }

            .shots {
                display: flex;
                gap: 12px;
                width: 100%;
                overflow-x: auto;
                scroll-snap-type: x mandatory;
                padding-bottom: 8px;
            }

            .shots:empty {
                display: none;
            }

            .shots img {
                flex: 0 0 auto;
                width: min(200px, 44vw);
                height: auto;
                border: 1px solid #1a2238;
                border-radius: 12px;
                scroll-snap-align: center;
            }

            .as-badge {
                display: inline-block;
                opacity: 0.9;
                transition: opacity 0.2s;
            }

            .as-badge:hover {
                opacity: 1;
            }

            .as-badge img {
                display: block;
                width: clamp(140px, 38vw, 180px);
                height: auto;
            }

            .links {
                font-size: var(--ps-3);
                letter-spacing: 1px;
            }

            .made {
                font-size: var(--ps-1);
                letter-spacing: 2px;
                color: var(--dim);
            }

            .made .heart {
                color: #ff6600;
            }
        </style>
    </head>

                <img src="assets/app-store-badge.svg" alt="Download on the App Store" width="180" height="60" />

                    // 'screenshots/02-asteroid-alarm.jpg',
                    // 'screenshots/03-galaxy.jpg',

                const shots = document.getElementById('shots');
                for (const src of SCREENSHOTS) {
                    const img = document.createElement('img');
                    img.src = src;
                    img.alt = 'Populate the Stars screenshot';
                    img.loading = 'lazy';

                // Legal page in the visitor's language (same languages as the game).

                document.getElementById('legal-link').href = `legal.html?lang=${lang}`;
            })();
