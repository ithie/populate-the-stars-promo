            :root {
                --bg: #020205;
                --text: #9aa6c0;
                --dim: #7a84a0;
                --pop: #ffa02e;
                --res: #3fd3c6;
                --gold: #ffcf40;
                --ps-1: 8px;
                --ps-2: 10px;
                --ps-3: 13px;
            }

            * {
                box-sizing: border-box;
            }

            html,
            body {
                margin: 0;
                min-height: 100%;
                background: var(--bg);
                color: var(--text);
                font-family: 'PressStart2P', monospace;
            }

            body {
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 32px 16px 48px;
            }

            main,
            footer {
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
                gap: 28px;
                width: 100%;
                max-width: 640px;
            }

            footer {
                margin-top: 28px;
            }

            a {
                color: #fff;
                text-decoration: none;
                transition: color 0.2s;
            }

            a:hover {
                color: var(--res);
            }

            :focus-visible {
                outline: 2px solid var(--res);
                outline-offset: 4px;
            }

            @media (prefers-reduced-motion: reduce) {
                * {
                    transition: none !important;
                    scroll-behavior: auto !important;
                }
            }

            /* ── Promo ── */

            h1 {
                margin: 0;
                font-size: clamp(22px, 6vw, 44px);
                font-weight: normal;
                line-height: 1.3;
                letter-spacing: 4px;
                color: var(--pop);
                text-shadow:
                    0 0 18px var(--pop),
                    0 0 46px rgba(255, 160, 46, 0.35);
            }

            .tagline {
                margin: 0;
                font-size: var(--ps-2);
                line-height: 2;
                letter-spacing: 2px;
            }

            .tagline .accent {
                color: var(--res);
            }

            .shots {
                display: flex;
                gap: 12px;
                width: 100%;
                margin: 0;
                padding: 6px 6px 10px;
                list-style: none;
                overflow-x: auto;
                scroll-snap-type: x mandatory;
                scroll-padding: 0 6px;
            }

            /* Wider than the text column, so all four fit on larger screens. */
            .screenshots {
                width: min(880px, calc(100vw - 32px));
            }

            .shots li {
                flex: 0 0 auto;
                scroll-snap-align: start;
            }

            /* Centered while they fit, scrollable from the first one when they don't. */
            .shots li:first-child {
                margin-left: auto;
            }

            .shots li:last-child {
                margin-right: auto;
            }

            .tagline .nowrap {
                white-space: nowrap;
            }

            .shots a {
                display: block;
                border-radius: 12px;
            }

            .shots img {
                display: block;
                width: min(200px, 44vw);
                height: auto;
                aspect-ratio: 1170 / 2532;
                border: 1px solid #1a2238;
                border-radius: 12px;
                transition: border-color 0.2s;
            }

            .shots a:hover img {
                border-color: var(--res);
            }

            /* Screenshot viewer (enlarged on click) */
            .viewer {
                width: 100vw;
                max-width: 100vw;
                height: 100dvh;
                max-height: 100dvh;
                margin: 0;
                padding: 16px;
                border: 0;
                background: transparent;
                color: var(--text);
            }

            .viewer::backdrop {
                background: rgba(2, 2, 5, 0.94);
            }

            .viewer[open] {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 14px;
            }

            .viewer img {
                display: block;
                max-width: 100%;
                max-height: calc(100dvh - 140px);
                width: auto;
                height: auto;
                border: 1px solid #1a2238;
                border-radius: 16px;
            }

            .viewer p {
                margin: 0;
                max-width: 480px;
                font-size: var(--ps-2);
                line-height: 1.8;
                text-align: center;
            }

            .viewer .bar {
                display: flex;
                gap: 12px;
            }

            .viewer button {
                min-width: 44px;
                min-height: 44px;
                padding: 0 14px;
                border: 1px solid #2a3556;
                border-radius: 4px;
                background: #070a14;
                color: #fff;
                font: inherit;
                font-size: var(--ps-3);
                cursor: pointer;
            }

            .viewer button:hover {
                color: var(--res);
                border-color: var(--res);
            }

            .as-badge {
                display: inline-block;
                opacity: 0.9;
                transition: opacity 0.2s;
            }

            .as-badge:hover {
                opacity: 1;
            }

            .as-badge img {
                display: block;
                width: clamp(140px, 38vw, 180px);
                height: auto;
            }

            .links {
                font-size: var(--ps-3);
                letter-spacing: 1px;
            }

            .made {
                font-size: var(--ps-2);
                letter-spacing: 2px;
                color: var(--dim);
            }

            .made .heart {
                color: #ff6600;
            }
        </style>
    </head>

        <dialog class="viewer" id="viewer" aria-labelledby="viewer-caption">
            <img id="viewer-img" alt="" />
            <p id="viewer-caption"></p>
            <div class="bar">
                <button type="button" id="viewer-prev" aria-label="Previous screenshot">‹</button>
                <button type="button" id="viewer-close" aria-label="Close">✕</button>
                <button type="button" id="viewer-next" aria-label="Next screenshot">›</button>
            </div>
        </dialog>
        <script>
            // Promo page: the screenshot viewer and the legal link in the visitor's language.
            (() => {
                'use strict';

                // Screenshot viewer: the links open the original in a modal dialog (Esc closes,
                // arrow keys browse, focus returns to the link). Without JS the links just work.
                const links = [...document.querySelectorAll('.shots a')];
                const viewer = document.getElementById('viewer');
                const img = document.getElementById('viewer-img');
                const caption = document.getElementById('viewer-caption');
                let current = 0;
                const show = i => {
                    current = (i + links.length) % links.length;
                    const thumb = links[current].querySelector('img');
                    img.src = links[current].href;
                    img.alt = thumb.alt;
                    caption.textContent = `${current + 1} / ${links.length} – ${thumb.alt}`;
                };
                if (typeof viewer.showModal === 'function') {
                    links.forEach((a, i) =>
                        a.addEventListener('click', e => {
                            e.preventDefault();
                            show(i);
                            viewer.showModal();
                            document.getElementById('viewer-close').focus();
                        })
                    );
                    document.getElementById('viewer-prev').addEventListener('click', () => show(current - 1));
                    document.getElementById('viewer-next').addEventListener('click', () => show(current + 1));
                    document.getElementById('viewer-close').addEventListener('click', () => viewer.close());
                    viewer.addEventListener('keydown', e => {
                        if (e.key === 'ArrowLeft') show(current - 1);
                        else if (e.key === 'ArrowRight') show(current + 1);
                    });
                    // A click on the dark backdrop closes it.
                    viewer.addEventListener('click', e => {
                        if (e.target === viewer) viewer.close();
                    });
                    viewer.addEventListener('close', () => links[current].focus());
                }

                // Legal page in the visitor's language (same languages as the game).
                const nav = (navigator.language || 'en').toLowerCase();
                const lang = nav.startsWith('pt') ? (nav === 'pt-br' ? 'pt-BR' : 'pt') : ['de', 'fr', 'es'].includes(nav.slice(0, 2)) ? nav.slice(0, 2) : 'en';
                document.getElementById('legal-link').href = `legal.html?lang=${lang}`;
            })();
        </script>
    </body>
</html>
